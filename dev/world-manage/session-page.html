<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session 与 World · HanaWorlds</title><style>
:root{font-family:system-ui,sans-serif;color:#24372d;background:#f3f5ef}body{max-width:1000px;margin:36px auto;padding:0 24px}h1{font-size:30px;margin-bottom:8px}h2{font-size:21px}.muted{color:#607063;font-size:14px}.fixture{background:#fff1c4;border:1px solid #d4b450;padding:14px;border-radius:10px;margin:18px 0}.panel,article{background:white;border:1px solid #d6dfd4;border-radius:12px;padding:20px;margin:14px 0}.row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit;padding:9px 12px;border:1px solid #bccbbf;border-radius:7px;background:white}button{cursor:pointer}button.primary{background:#2f6248;color:white;border-color:#2f6248}button:disabled{opacity:.45;cursor:default}button.danger{color:#9d352f}.chosen{border-color:#2f6248;box-shadow:0 0 0 1px #2f6248}.pill{display:inline-block;background:#e6f0e4;padding:3px 9px;border-radius:20px;font-size:13px}.status{min-height:24px;margin:16px 0;color:#23583c}.error{color:#a62c2c}dialog{max-width:550px;border:1px solid #bccbbf;border-radius:12px;padding:24px}dialog::backdrop{background:#12271a66}pre{font-size:12px;overflow:auto}label{display:block}.session-status{margin:8px 0 12px}footer{margin:28px 0;color:#607063;font-size:13px}
</style><body><div class="row"><div><h1>Session 与 World</h1><div class="muted">先选择会话，再选择它当前操作的世界。</div></div><span class="pill" id="version">正在读取</span></div>
<div class="fixture"><strong>合约 fixture 会话 · 真实隔离世界</strong><div id="fixture">Session / Canvas 为公开合约 fixture；Luanti 世界在本卡独立目录运行。真实 Core / 模型未启用。</div></div>
<div class="status" id="message" role="status">选择会话不需要先连接世界。</div>
<section aria-labelledby="session-heading"><h2 id="session-heading">Session 管理</h2><div class="muted">示例会话 S1 / S2 可共用一个世界，每个会话同时只有一个当前世界。持久删除能力未提供。</div><div id="sessions"></div></section>
<section aria-labelledby="world-heading"><div class="row"><h2 id="world-heading">World 管理</h2><div class="actions"><label>世界名称 <input id="world-name" placeholder="例如：平地 A"></label><button class="primary" id="create">新建平地世界</button><button id="refresh">刷新</button></div></div><div class="muted" id="prerequisites"></div><div id="worlds"></div></section>
<dialog id="deletion"><h2 id="delete-title">删除世界</h2><p id="loss"></p><p id="blockers"></p><div class="actions"><button id="cancel">取消</button><button class="danger" id="confirm">确认永久删除</button></div></dialog>
<details><summary>本次运行信息</summary><pre id="details"></pre></details><footer>绑定与解绑均由 fixture Canvas 权威读回。停止连接不会替你解除 Session 选择；选择中的世界禁止删除。</footer>
<script>
const $=id=>document.getElementById(id);let state,busy=false,preview;
const labels=new Map();const label=ref=>labels.get(ref)??'示例会话';
const say=(text,error=false)=>{$('message').textContent=text;$('message').className='status'+(error?' error':'')};
async function call(path,body={}){const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),value=await r.json();if(!r.ok||!value.ok)throw Error(value.error?.code??value.error??'读取失败');return value.result;}
function locks(){document.querySelectorAll('button,select,input').forEach(e=>{e.disabled=busy||e.dataset.blocked==='true'})}
async function run(fn){if(busy)return;busy=true;locks();try{await fn()}catch(e){say(e.message,true)}finally{busy=false;locks()}}
async function refresh(){state=await(await fetch('/api/state')).json();if(state.ok===false)throw Error(state.error.code);$('version').textContent=`Adapter ${state.adapterVersion} · ${state.contracts}`;$('fixture').textContent=state.fixture;state.sessions.forEach((s,i)=>labels.set(s.sessionRef,'示例会话 S'+(i+1)));$('sessions').replaceChildren();
 const names=new Map(state.worlds.map(w=>[w.worldRef,w.worldName]));
 for(const s of state.sessions){const card=document.createElement('article');card.className=state.chosenSession===s.sessionRef?'chosen':'';const heading=document.createElement('div');heading.className='row';const title=document.createElement('strong');title.textContent=label(s.sessionRef)+' · fixture';const choose=document.createElement('button');choose.textContent=state.chosenSession===s.sessionRef?'已选会话':'选择会话';choose.dataset.blocked=String(state.chosenSession===s.sessionRef);choose.onclick=()=>run(async()=>{await call('/api/choose',{sessionRef:s.sessionRef});await refresh();say('已选择 '+label(s.sessionRef)+'；没有世界时保持未连接。')});heading.append(title,choose);card.append(heading);
 const info=document.createElement('div');info.className='session-status muted';const connection=s.connectionState.status;info.textContent=connection==='UNBOUND'?'未绑定 · 未连接':`${names.get(s.connectionState.worldRef)??'已选世界'} · ${connection==='CONNECTED'?'已连接':'已选择，未连接'}`;card.append(info);
 const actions=document.createElement('div');actions.className='actions';const select=document.createElement('select');select.setAttribute('aria-label',label(s.sessionRef)+' 当前世界');select.dataset.blocked=String(state.chosenSession!==s.sessionRef);select.append(new Option('选择当前 World',''));for(const w of state.worlds)select.append(new Option(w.worldName,w.connectionRef));if(s.selection.status==='BOUND')select.value=s.selection.connectionRef;select.onchange=()=>run(async()=>{if(!select.value)return;await call('/api/select',{sessionRef:s.sessionRef,connectionRef:select.value});await refresh();say(label(s.sessionRef)+' 的当前世界已读回确认。')});const unselect=document.createElement('button');unselect.textContent='解除世界绑定';unselect.dataset.blocked=String(s.selection.status!=='BOUND');unselect.onclick=()=>run(async()=>{await call('/api/unselect',{sessionRef:s.sessionRef});await refresh();say(label(s.sessionRef)+' 已解绑，其他会话的选择保留。')});actions.append(select,unselect);card.append(actions);$('sessions').append(card);}
 $('worlds').replaceChildren();if(!state.worlds.length){const p=document.createElement('p');p.textContent='还没有世界。可先选择会话，再新建平地世界。';$('worlds').append(p)}
 for(const w of state.worlds){const card=document.createElement('article'),heading=document.createElement('div');heading.className='row';const title=document.createElement('strong');title.textContent=w.worldName;const info=document.createElement('div');info.className='muted';info.textContent=`${w.running?'真实 Luanti 连接运行中':'世界已保存 · 未连接'}${w.selectedBy.length?' · 被 '+w.selectedBy.map(label).join('、')+' 选择':' · 无会话选择'}`;const actions=document.createElement('div');actions.className='actions';const stop=document.createElement('button');stop.textContent='停止连接';stop.dataset.blocked=String(!w.running);stop.onclick=()=>run(async()=>{await call('/api/stop',{connectionRef:w.connectionRef});await refresh();say('连接已停止，Session 最后选择保留并显示未连接。')});const del=document.createElement('button');del.textContent='删除世界';del.className='danger';del.dataset.blocked=String(w.selectedBy.length>0);del.onclick=()=>run(async()=>{preview=await call('/api/preview-delete',{connectionRef:w.connectionRef});$('delete-title').textContent='删除 '+preview.worldName;$('loss').textContent=`永久删除整个世界目录：${preview.dataLoss.files} 个文件、${preview.dataLoss.bytes} 字节；无法撤销。`;$('blockers').textContent=preview.deletable?'世界未连接、没有任何会话选择，允许确认删除。':'不能删除：'+preview.blockers.map(b=>b.reason??b.code).join('；');$('confirm').dataset.blocked=String(!preview.deletable);$('deletion').showModal()});actions.append(stop,del);heading.append(title,actions);card.append(heading,info);$('worlds').append(card);}
 $('prerequisites').textContent=state.prerequisites.ready?'':'缺少前置：'+JSON.stringify(state.prerequisites.missing);$('details').textContent=JSON.stringify({pid:state.pid,connections:state.inventory.connections.map(c=>({world:c.worldRef,incarnation:c.connectionIncarnationRef})),worlds:state.worlds.map(w=>({name:w.worldName,nativeProcessId:w.nativeProcessId})),capabilityRevision:state.inventory.capabilityRevision},null,2);locks();
}
$('create').onclick=()=>run(async()=>{say('正在创建独立平地世界…');const row=await call('/api/create',{worldName:$('world-name').value.trim()||undefined});$('world-name').value='';await refresh();say('已创建 '+row.worldName+'；在会话旁选择它即可连接。')});$('refresh').onclick=()=>run(async()=>{await refresh();say('权威状态已刷新。')});
$('cancel').onclick=()=>run(async()=>{await call('/api/cancel-delete',{confirmationRef:preview.confirmationRef});preview=null;$('deletion').close();await refresh();say('已取消删除，世界保留。')});$('deletion').addEventListener('cancel',e=>{e.preventDefault();$('cancel').click()});$('confirm').onclick=()=>run(async()=>{await call('/api/confirm-delete',{confirmationRef:preview.confirmationRef});preview=null;$('deletion').close();await refresh();say('世界已删除，目录与列表均已确认不存在。')});
refresh().catch(e=>say(e.message,true));
</script></body></html>
